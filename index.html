<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXA-BioInspect | Motor de Inferencia J48</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>NEXA-BioInspect</h1>
            <p class="subtitle">Motor de Inferencia Predictiva - Algoritmo J48 (Mushroom Dataset)</p>
        </header>

        <section class="form-section">
            <p class="instruction">Ingrese las características morfológicas y biológicas del espécimen:</p>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="odor">Perfil Olfativo (Odor):</label>
                    <select id="odor">
                        <option value="n">Ninguno (None)</option>
                        <option value="f">Fétido (Foul)</option>
                        <option value="p">Picante (Pungent)</option>
                        <option value="a">Almendra (Almond)</option>
                        <option value="l">Anís (Anise)</option>
                        <option value="y">Pescado (Fishy)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="spore-color">Color de Espora (Spore Print):</label>
                    <select id="spore-color">
                        <option value="k">Negro (Black)</option>
                        <option value="n">Marrón (Brown)</option>
                        <option value="w">Blanco (White)</option>
                        <option value="h">Chocolate</option>
                        <option value="r">Verde (Green)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cap-shape">Forma del Sombrero (Cap Shape):</label>
                    <select id="cap-shape">
                        <option value="x">Convexo (Convex)</option>
                        <option value="b">Campanulado (Bell)</option>
                        <option value="s">Deprimido (Sunken)</option>
                        <option value="f">Plano (Flat)</option>
                        <option value="k">Periférico (Knobbed)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="habitat">Hábitat de Crecimiento:</label>
                    <select id="habitat">
                        <option value="g">Praderas (Grasses)</option>
                        <option value="l">Hojas (Leaves)</option>
                        <option value="m">Prados (Meadows)</option>
                        <option value="u">Urbanos (Urban)</option>
                        <option value="w">Bosques (Woods)</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="gill-size">Tamaño de las Branquias (Gill Size):</label>
                    <select id="gill-size">
                        <option value="b">Anchas (Broad)</option>
                        <option value="n">Estrechas (Narrow)</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <button onclick="evaluarModeloJ48()">Ejecutar Motor de Predicción</button>
                </div>
            </div>
        </section>

        <!-- Panel de Resultado Dinámico -->
        <div id="result-panel" class="result-panel" style="display: none;">
            <div id="verdict-card" class="verdict-card">
                <h2 id="res-title"></h2>
                <p id="res-rule"></p>
                <div id="res-badge" class="badge"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
